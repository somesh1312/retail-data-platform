version: 2

models:

  - name: stg_orders

    columns:

      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - processing
                  - cancelled


  - name: stg_customers

    columns:

      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: email
        data_tests:
          - not_null


  - name: stg_products

    columns:

      - name: product_id
        data_tests:
          - unique
          - not_null


  - name: stg_inventory

    columns:

      - name: product_id
        data_tests:
          - not_null

      - name: warehouse
        data_tests:
          - not_null