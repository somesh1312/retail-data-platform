name: Retail Data Platform CI


on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main


jobs:

  python-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Install dependencies

        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements.txt


      - name: Compile Python files

        run: |

          python -m compileall \
            ingestion \
            scripts \
            product_api


      - name: Run unit tests

        run: |

          pytest -v


      - name: Validate dbt project

        run: |

          cd retail_analytics

          dbt parse

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Build Airflow image

        run: |

          docker build \
            -f Dockerfile.airflow \
            -t retail-airflow:test \
            .